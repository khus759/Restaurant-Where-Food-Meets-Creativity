<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant-Where Food Meets Creativity</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=David+Libre:wght@400;500;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body class="ov_hidden">
    <header>
        <div class="container">
            <nav class="d_flex ">
                <img class="nav__logo" src="./assets/images/logo_restro.svg" alt="Restaurant_logo"
                    aria-label="Restaurant_logo">
                <ul class="nav__ul d_flex li_style_none">
                    <li><a class="link_style_none primery_color l_height_29" href="#">Menu</a></li>
                    <li><a class="link_style_none primery_color l_height_29" href="#">Events</a></li>
                    <li><a class="link_style_none primery_color l_height_29" href="#">Gallery</a></li>
                    <li><a class="link_style_none primery_color l_height_29" href="#">About</a></li>
                    <li><a class="link_style_none primery_color l_height_29" href="#">Contact</a></li>
                </ul>
                <a class="link_style_none btn f_family_dav" href="#">Book a table</a>
            </nav>
        </div>
    </header>
    <main></main>
    <footer>
        <div class="container">
            <div class="footer__promo">
                <img class="z_index1 pt_absolute" src="./assets/images/promo-img.svg" alt="promo-img">
                <div class="footer__content text_align">
                    <p class="f_family_dav l_height_58 text_50 f_weight_boldr white_color ">Get Or Promo Code by <span
                            class="d_block">Subscribing To our Newsletter</span></p>
                    <form action="/submit" get="post" class="email">
                        <label for="email id"></label>
                        <input type="email" name="email" id="email" placeholder="Enter your email" class="br_none ">
                        <a href="#" class="f_weight_boldr white_color pt_absolute z_index2 btn btn--subscribe link_style_none">Subscribe</a> 
                    </form>
                </div>
            </div>
            <div class="footer__bottom">
                <img class="z_index1 pt_absolute img_op_3" src="./assets/images/bg_food_paien.svg" alt="food_paien">
                <div class="footer__logo-sec">
                    <img src="./assets/images/logo_restro.svg" alt="logo_restro" aria-label="Restaurant_logo" class="mb_logo">
                    <p class="l_height_29 dark_grey_color">Lorem ipsum dolor sit amet, consectetur adipiscing <span class="d_block">elit,sed do eiusmod tempor incididunt ut labore et</span>  dolore <a href="#" class="dark_grey_color">.Learn more </a></p>
                </div>
                <div class="footer__nav">
                    <p class="text_12 f_weight_boldr l_height_40 primery_color">Navigation</p>
                </div>
            </div>
        </div>  
    </footer>
</body>

</html>
